name: ZDOS Ecosystem Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab
        uses: actions/checkout@v4

      - name: Checkout official sources
        uses: actions/checkout@v4
        with:
          repository: high-cde/ZDOS
          ref: ddf7f52dc42076dd90d849ad1b3b714ae694e8d4
          path: ZDOS
      - uses: actions/checkout@v4
        with:
          repository: high-cde/Zlang
          ref: 65e5c41f9b28b349c9ba18cda26b4ea8d5125833
          path: Zlang
      - uses: actions/checkout@v4
        with:
          repository: high-cde/zdos-organism
          ref: e70a465f7c7eb8655f08e4003bfa1eb47ef386f9
          path: zdos-organism
      - uses: actions/checkout@v4
        with:
          repository: high-cde/ZDOS-SEC-PORTAL
          ref: 47247dfd3eff79fbd0078b4187547dba37ac4818
          path: ZDOS-SEC-PORTAL
      - uses: actions/checkout@v4
        with:
          repository: high-cde/Z-CYBERCORE
          ref: e8637a4e59e454a0b8bc0f748d4ed0d9bd5de4a0
          path: Z-CYBERCORE

      - name: Verify ZDOS repository hygiene
        run: bash ZDOS/scripts/check-repository-hygiene.sh

      - name: Verify Zlang repository hygiene
        working-directory: Zlang
        run: python3 tools/check_repository_hygiene.py

      - name: Verify Lab repository hygiene
        run: bash orchestration/check-repository-hygiene.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ZDOS-SEC-PORTAL/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Zlang compiler contract
        working-directory: Zlang
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify Rust runtimes
        run: |
          cargo test --manifest-path Zlang/Cargo.toml --all-targets
          cargo test --manifest-path zdos-organism/Cargo.toml --workspace --all-targets --all-features
          cargo test --manifest-path Z-CYBERCORE/Cargo.toml --all-targets

      - name: Verify SEC Portal
        working-directory: ZDOS-SEC-PORTAL
        run: npm ci --ignore-scripts && npm test

      - name: Verify Lab contract and safe gate
        env:
          ZDOS_LAB_WORKSPACE: ${{ github.workspace }}
        run: |
          bash -n orchestration/zdos-labctl
          ./orchestration/zdos-labctl inspect
          ./orchestration/zdos-labctl gate
          python3 orchestration/zdos-lab-pack.py --component unified --output-dir "$RUNNER_TEMP/zdos-artifacts"

      - name: Generate integration manifest
        env:
          ZDOS_LAB_WORKSPACE: ${{ github.workspace }}
        run: ./orchestration/zdos-labctl manifest

      - name: Upload integration manifest
        uses: actions/upload-artifact@v4
        with:
          name: zdos-integration-manifest
          path: |
            artifacts/lab-state.json
            ${{ runner.temp }}/zdos-artifacts/SHA256SUMS*
